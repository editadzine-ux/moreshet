<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" fill="none" stroke="#b6e9e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><style>*{transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,12%{transform:scaleX(1)}42%,58%{transform:scaleX(-1)}88%,100%{transform:scaleX(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.6}}
@keyframes slide{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,-4px)}}
@keyframes ty{0%{stroke-dashoffset:var(--l)}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:var(--l)}}
@keyframes film{to{transform:translateY(-110px)}}
@keyframes mag{0%,100%{transform:translate(0,0)}50%{transform:translate(-46px,-34px)}}
@keyframes rock{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
