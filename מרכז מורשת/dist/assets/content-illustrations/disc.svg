<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" fill="none" stroke="#b6e9e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><style>*{transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,12%{transform:scaleX(1)}42%,58%{transform:scaleX(-1)}88%,100%{transform:scaleX(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.6}}
@keyframes slide{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,-4px)}}
@keyframes ty{0%{stroke-dashoffset:var(--l)}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:var(--l)}}
@keyframes film{to{transform:translateY(-110px)}}
@keyframes mag{0%,100%{transform:translate(0,0)}50%{transform:translate(-46px,-34px)}}
@keyframes rock{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle cx="150" cy="190" r="140" fill="#ffffff08"/><g style="animation:spin 18s linear infinite"><circle cx="150" cy="190" r="58" opacity=".18"/><circle cx="150" cy="190" r="67" opacity=".18"/><circle cx="150" cy="190" r="76" opacity=".18"/><circle cx="150" cy="190" r="85" opacity=".18"/><circle cx="150" cy="190" r="94" opacity=".18"/><circle cx="150" cy="190" r="103" opacity=".18"/><circle cx="150" cy="190" r="112" opacity=".18"/><circle cx="150" cy="190" r="121" opacity=".18"/><circle cx="150" cy="190" r="130" opacity=".18"/><path d="M72 100a110 110 0 0 1 60-42M228 280a110 110 0 0 1-60 42" stroke-width="7" opacity=".4"/><path d="M92 120a86 86 0 0 1 34-30M208 260a86 86 0 0 1-34 30" opacity=".7"/></g><circle cx="150" cy="190" r="140"/><circle cx="150" cy="190" r="52"/><circle cx="150" cy="190" r="18" fill="#ffffff14"/><circle cx="150" cy="190" r="8"/><g style="animation:pulse 3s ease-in-out infinite"><path d="M12 150q-8 40 0 80M0 130q-16 60 0 120" /></g><g style="animation:pulse 3s ease-in-out 1.5s infinite"><path d="M288 150q8 40 0 80M300 130q16 60 0 120"/></g></svg>
